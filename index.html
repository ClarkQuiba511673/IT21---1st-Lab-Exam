<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Identity Cipher</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Student Identity Cipher</h1>
            <p class="subtitle">Caesar Cipher (Security Demo): E = (x + N) % 26 and D = (x - N) % 26</p>
        </header>

        <main>
            <div class="input-card">
                <div class="form-group full-width">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter your full name">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="yearLevel">Year Level</label>
                        <input type="text" id="yearLevel" placeholder="e.g. 1, 2, 3, 4">
                    </div>
                    <div class="form-group">
                        <label for="course">Course</label>
                        <input type="text" id="course" placeholder="e.g. BSIT, BSCS">
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="keyN">Key (N) — shift 1 to 25</label>
                    <input type="number" id="keyN" min="1" max="25" value="3">
                </div>

                <div class="button-group">
                    <button id="encryptBtn" class="btn-primary">Encrypt</button>
                    <button id="decryptBtn" class="btn-success">Decrypt</button>
                    <button id="clearBtn" class="btn-dark">Clear</button>
                </div>

                <div class="output-row">
                    <div class="output-box">
                        <label>Input (Combined Plaintext)</label>
                        <textarea id="combinedPlaintext" readonly></textarea>
                    </div>
                    <div class="output-box">
                        <label id="outputLabel">Output</label>
                        <textarea id="resultOutput" readonly></textarea>
                    </div>
                </div>
            </div>
            <p class="footer-note">Note: Only letters are shifted (A–Z). Numbers/symbols remain unchanged.</p>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
